services:
  suricata:
    image: jasonish/suricata:latest
    container_name: suricata
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    volumes:
      - ./configs/suricata/suricata.yaml:/etc/suricata/suricata.yaml
      - ./configs/suricata/rules:/var/lib/suricata/rules
      - ./logs:/var/log/suricata
    command: -i enp0s8 -v

  web_target:
    image: php:8.2-apache
    container_name: web_target
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./html:/var/www/html
      - ./logs/apache:/var/log/apache2
    networks:
      - siem-net

  syslog-ng:
    image: balabit/syslog-ng:latest
    container_name: siem_syslog_ng
    restart: unless-stopped
    depends_on:
      es01:
        condition: service_healthy
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    volumes:
      - ./configs/syslog-ng/syslog-ng.conf:/etc/syslog-ng/syslog-ng.conf:ro
      - ./logs:/var/log/suricata:ro
      - ./logs/apache:/var/log/apache2:ro
    networks:
      - siem-net
      - default

  setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    depends_on:
      es01:
        condition: service_healthy
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - KIBANA_PASSWORD=${KIBANA_PASSWORD:?Définis KIBANA_PASSWORD dans le fichier .env}
    command:
      - bash
      - -c
      - |
        curl -sf -X POST -u "elastic:$$ELASTIC_PASSWORD" \
          -H "Content-Type: application/json" \
          http://es01:9200/_security/user/kibana_system/_password \
          -d "{\"password\":\"$$KIBANA_PASSWORD\"}"

  es01:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?Définis ELASTIC_PASSWORD dans le fichier .env}
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "127.0.0.1:9200:9200"   # accessible uniquement depuis la VM
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:$$ELASTIC_PASSWORD http://localhost:9200 | grep -q cluster_name"]
      interval: 10s
      timeout: 5s
      retries: 30

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      - ELASTICSEARCH_HOSTS=http://es01:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
    ports:
      - "5601:5601"

volumes:
  esdata:

networks:
  siem-net:
    driver: bridge
