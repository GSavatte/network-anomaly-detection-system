version: "3.8"

services:
  suricata:
    image: jasonish/suricata:latest
    container_name: suricata
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    volumes:
      - ./configs/suricata/suricata.yaml:/etc/suricata/suricata.yaml
      - ./configs/suricata/rules:/var/lib/suricata/rules
      - ./logs:/var/log/suricata
    command: -i enp0s8 -v

  web_target:
    image: php:8.2-apache
    container_name: web_target
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./html:/var/www/html
      - ./logs/apache:/var/log/apache2

networks:
  elastic:
    external: true
    name: "elastic"
    
services:
